<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Eggool</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #unity-container {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #unity-canvas {
      display: block;
      background: #000;
      outline: none;
    }

    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #unity-progress-bar-empty {
      width: 220px;
      height: 14px;
      border-radius: 7px;
      background: #1a1a1a;
      border: 1px solid #333;
      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #4CAF50, #8BC34A);
      border-radius: 7px;
      transition: width 0.2s ease;
    }

    #unity-loading-text {
      color: #ccc;
      font-family: Arial, sans-serif;
      font-size: 13px;
      margin-top: 8px;
    }

    /* Landscape prompt for mobile portrait */
    #rotate-prompt {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #rotate-prompt .rotate-icon {
      font-size: 60px;
      margin-bottom: 16px;
      animation: rotate-anim 1.5s ease-in-out infinite;
    }

    @keyframes rotate-anim {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    #rotate-prompt p {
      font-size: 16px;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-loading-text">Loading...</div>
    </div>
  </div>

  <div id="rotate-prompt">
    <div class="rotate-icon">📱</div>
    <p>Please rotate your device to landscape</p>
  </div>

  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build.loader.js";
    var config = {
      dataUrl: buildUrl + "/Build.data.unityweb",
      frameworkUrl: buildUrl + "/Build.framework.js.unityweb",
      codeUrl: buildUrl + "/Build.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Bacoor",
      productName: "Eggool",
      productVersion: "27",
    };

    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var loadingText = document.querySelector("#unity-loading-text");

    // Handle responsive resize — fill full screen on all devices
    function resizeCanvas() {
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", function () {
      setTimeout(resizeCanvas, 200);
    });
    resizeCanvas();

    // Optional: show rotate prompt on mobile portrait
    function checkOrientation() {
      var rotatePrompt = document.getElementById("rotate-prompt");
      var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile && window.innerHeight > window.innerWidth) {
        rotatePrompt.style.display = "flex";
      } else {
        rotatePrompt.style.display = "none";
      }
    }

    window.addEventListener("resize", checkOrientation);
    window.addEventListener("orientationchange", function () {
      setTimeout(checkOrientation, 200);
    });
    checkOrientation();

    // Load Unity
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = (100 * progress) + "%";
        loadingText.textContent = "Loading... " + Math.round(100 * progress) + "%";
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";

        // Try to enter fullscreen on mobile tap
        canvas.addEventListener("touchend", function () {
          if (document.fullscreenElement === null) {
            if (canvas.requestFullscreen) {
              canvas.requestFullscreen();
            } else if (canvas.webkitRequestFullscreen) {
              canvas.webkitRequestFullscreen();
            }
          }
        }, { once: true });

      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>

</html>
